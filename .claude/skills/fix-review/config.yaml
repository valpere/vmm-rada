# vmm-rada project-level fix-review config.
# Overrides ~/.claude/skills/fix-review/config.yaml for this repo.
# Provider: Ollama (cloud models via local endpoint — no OpenRouter key needed).

provider: ollama

# Load API key from this env var instead of the default OPENROUTER_API_KEY.
# AI_PROVIDER_API_KEY is set in .env; Ollama ignores the auth header but
# the value must be non-empty to pass the skill's key-presence check.
api_key_env: AI_PROVIDER_API_KEY

reviewers:
  # 2026-09-17: qwen3.5:397b-cloud (the size-suffixed model plain
  # qwen3.5:cloud aliases to — confirmed via usage-dashboard bucket
  # matching in ollama-general-models.md) retires on Ollama Cloud
  # 2026-09-25 (forced). Ollama's announcement offers two 1:1
  # replacements (glm-5.3-flash or deepseek-v4.1-flash); picked
  # deepseek-v4.1-flash — no family collision with round_2/round_3 here
  # (minimax/gemma), and deepseek has the stronger cost track record in
  # our own calibration data (ollama-general-models.md).
  openrouter:
    round_1: { model: deepseek-v4.1-flash:cloud }   # coding-focused, cloud quality
    round_2: { model: minimax-m2.7:cloud }          # MiniMax, non-thinking, long-ctx
    round_3: { model: gemma4:31b-cloud }            # Gemma code model, non-thinking

  # External coding-agent CLIs — tier 2. Engages when the cloud probe fails,
  # tried before the local Ollama tier below. Cascades in list order; first
  # tool returning non-empty output wins. See .claude/skills/lib/agents.sh.
  external_agents:
    - { tool: cursor-agent, model: auto }
    - { tool: agy, model: "Gemini 3.5 Flash (Low)" }
    - { tool: omp }
    - { tool: codex }
    - { tool: opencode, model: "opencode/nemotron-3-ultra-free" }
    - { tool: kilo }

  # Local failover tier (tier 3) — tools-capable models, no network
  # dependency. Key is named "cli" for historical reasons; it is actually
  # local Ollama, not an external CLI tier (that's external_agents above).
  # Engages automatically when the Ollama cloud endpoint probe fails AND
  # every external_agents tool has also failed/returned empty.
  # ollama-review.sh reads the prompt from stdin, calls the OpenAI-compat
  # endpoint, and returns the model's raw content (JSON array expected).
  cli:
    - name: qwen3-coder-30b
      cmd: "bash .claude/skills/fix-review/ollama-review.sh qwen3-coder:30b"
    - name: qwen2.5-coder-7b
      cmd: "bash .claude/skills/fix-review/ollama-review.sh qwen2.5-coder:7b"
    - name: granite3.3-8b
      cmd: "bash .claude/skills/fix-review/ollama-review.sh granite3.3:8b"

# Ollama OpenAI-compat endpoint — used instead of the OpenRouter default.
# chat_payload_system + chat_content in rest.sh both work here since the
# /v1 endpoint returns .choices[0].message.content (OpenAI format).
openrouter_api_url: http://localhost:11434/v1/chat/completions

post_summary_to_pr: true
telemetry_enabled: true

pricing:
  # Active cloud reviewers (reviewers.openrouter.round_1/2/3)
  "deepseek-v4.1-flash:cloud": { input: 0.00, output: 0.00 }
  "minimax-m2.7:cloud":  { input: 0.00, output: 0.00 }
  "gemma4:31b-cloud":    { input: 0.00, output: 0.00 }
  # Local failover models (reviewers.cli)
  "qwen3-coder:30b":  { input: 0.00, output: 0.00 }
  "qwen2.5-coder:7b": { input: 0.00, output: 0.00 }
  "granite3.3:8b":    { input: 0.00, output: 0.00 }
  # External agents (reviewers.external_agents)
  "agy":  { input: 0.00, output: 0.00 }
